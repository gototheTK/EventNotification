# 📂 .github/workflows/deploy.yml
name: Spring Boot CI/CD to EC2

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시되면 자동 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test # 배포 시에는 테스트를 건너뛰어 속도 향상

    # 💡 [면접 어필 포인트] 여기서부터는 AWS EC2로 파일을 전송하고 실행하는 스크립트가 들어갑니다.
    # 면접에서는 "Github Actions를 통해 빌드된 .jar 파일을 AWS CodeDeploy나
    # SCP를 통해 EC2로 전송하고, background(nohup)로 실행하도록 파이프라인을 구상했습니다." 라고 답변합니다.